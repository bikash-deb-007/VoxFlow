<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxFlow — Voice to Text</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-muted: #6a6a80;
    --accent: #7c5cfc;
    --accent-glow: #7c5cfc44;
    --accent-bright: #a08aff;
    --recording: #ff4466;
    --recording-glow: #ff446644;
    --success: #44ffaa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Ambient background */
  .ambient {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .ambient::before {
    content: '';
    position: absolute; width: 600px; height: 600px; top: -200px; right: -100px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    border-radius: 50%; animation: drift 20s ease-in-out infinite;
  }
  .ambient::after {
    content: '';
    position: absolute; width: 500px; height: 500px; bottom: -200px; left: -100px;
    background: radial-gradient(circle, #ff446622 0%, transparent 70%);
    border-radius: 50%; animation: drift 25s ease-in-out infinite reverse;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(50px, 30px) scale(1.1); }
    66% { transform: translate(-30px, -20px) scale(0.95); }
  }

  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; max-width: 900px;
    margin: 0 auto; padding: 24px;
  }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    flex-wrap: wrap; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--recording));
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 22px; height: 22px; fill: white; }
  .logo h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text), var(--accent-bright));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo span {
    font-size: 11px; color: var(--text-muted); font-weight: 400;
    letter-spacing: 2px; text-transform: uppercase;
  }

  .settings-row { display: flex; gap: 10px; align-items: center; }
  .lang-select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 10px;
    font-family: 'Sora', sans-serif; font-size: 13px;
    cursor: pointer; outline: none; transition: border-color 0.2s;
  }
  .lang-select:hover { border-color: var(--accent); }
  .lang-select option { background: var(--surface); }

  .clear-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-muted); padding: 8px 16px; border-radius: 10px;
    font-family: 'Sora', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .clear-btn:hover { border-color: var(--recording); color: var(--recording); }

  /* Output area */
  .output-area {
    flex: 1; overflow-y: auto; padding: 32px 0;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .output-area::-webkit-scrollbar { width: 6px; }
  .output-area::-webkit-scrollbar-track { background: transparent; }
  .output-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .transcript {
    font-family: 'JetBrains Mono', monospace; font-size: 17px;
    line-height: 1.85; font-weight: 300; color: var(--text);
    white-space: pre-wrap; word-wrap: break-word; min-height: 200px;
  }
  .transcript .interim {
    color: var(--text-muted); border-bottom: 1px dashed var(--border);
  }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; gap: 20px; text-align: center; opacity: 0.6;
  }
  .empty-state .key-hint {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    font-size: 15px; color: var(--text-muted);
  }
  .key-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 1px solid var(--accent);
    color: var(--accent-bright); font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 8px;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .empty-state p {
    font-size: 13px; color: var(--text-muted); max-width: 360px; line-height: 1.6;
  }

  /* Mode switcher */
  .mode-switch {
    display: flex; gap: 4px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 3px;
  }
  .mode-btn {
    background: none; border: none; color: var(--text-muted);
    padding: 6px 14px; border-radius: 8px; font-family: 'Sora', sans-serif;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent); color: white;
  }

  /* Bottom bar */
  .bottom-bar {
    flex-shrink: 0; padding-top: 20px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    min-width: 160px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted); transition: all 0.3s; flex-shrink: 0;
  }
  .status-dot.recording {
    background: var(--recording);
    box-shadow: 0 0 12px var(--recording-glow), 0 0 24px var(--recording-glow);
    animation: pulse-dot 1s ease-in-out infinite;
  }
  .status-dot.ready { background: var(--success); }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.7; }
  }

  .mic-btn {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--accent); background: var(--surface);
    color: var(--accent-bright); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
    flex-shrink: 0;
  }
  .mic-btn:hover {
    background: var(--accent); color: white;
    box-shadow: 0 0 30px var(--accent-glow); transform: scale(1.05);
  }
  .mic-btn.recording {
    border-color: var(--recording); background: var(--recording); color: white;
    box-shadow: 0 0 40px var(--recording-glow);
    animation: pulse-btn 1.5s ease-in-out infinite;
  }
  @keyframes pulse-btn {
    0%, 100% { box-shadow: 0 0 20px var(--recording-glow); }
    50% { box-shadow: 0 0 50px var(--recording-glow), 0 0 80px var(--recording-glow); }
  }
  .mic-btn svg { width: 26px; height: 26px; fill: currentColor; }

  .rings { position: absolute; inset: -20px; pointer-events: none; }
  .rings .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--recording); opacity: 0;
  }
  .mic-btn.recording .ring { animation: ring-expand 2s ease-out infinite; }
  .mic-btn.recording .ring:nth-child(2) { animation-delay: 0.5s; }
  .mic-btn.recording .ring:nth-child(3) { animation-delay: 1s; }
  @keyframes ring-expand {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .actions { display: flex; gap: 8px; align-items: center; min-width: 160px; justify-content: flex-end; }
  .action-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-muted); padding: 10px 18px; border-radius: 10px;
    font-family: 'Sora', sans-serif; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent-bright); }
  .action-btn.copied { border-color: var(--success); color: var(--success); }

  .visualizer { display: flex; align-items: center; gap: 3px; height: 30px; }
  .visualizer .bar {
    width: 3px; height: 4px; background: var(--accent);
    border-radius: 2px; transition: height 0.1s ease;
  }
  .visualizer.recording .bar {
    background: var(--recording);
    animation: bar-dance 0.5s ease-in-out infinite alternate;
  }
  .visualizer.recording .bar:nth-child(1) { animation-delay: 0s; }
  .visualizer.recording .bar:nth-child(2) { animation-delay: 0.1s; }
  .visualizer.recording .bar:nth-child(3) { animation-delay: 0.2s; }
  .visualizer.recording .bar:nth-child(4) { animation-delay: 0.15s; }
  .visualizer.recording .bar:nth-child(5) { animation-delay: 0.05s; }
  .visualizer.recording .bar:nth-child(6) { animation-delay: 0.25s; }
  .visualizer.recording .bar:nth-child(7) { animation-delay: 0.12s; }
  @keyframes bar-dance { 0% { height: 4px; } 100% { height: 28px; } }

  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 24px; border-radius: 12px;
    font-size: 13px; font-family: 'Sora', sans-serif;
    opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .word-count {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted);
  }

  .new-para-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-muted); padding: 6px 12px; border-radius: 8px;
    font-family: 'Sora', sans-serif; font-size: 11px;
    cursor: pointer; transition: all 0.2s;
  }
  .new-para-btn:hover { border-color: var(--accent); color: var(--accent-bright); }

  @media (max-width: 600px) {
    .app { padding: 16px; }
    .transcript { font-size: 15px; }
    header { flex-direction: column; align-items: flex-start; }
    .bottom-bar { gap: 8px; }
    .status, .actions { min-width: auto; }
  }
</style>
</head>
<body>
<div class="ambient"></div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
      <div>
        <h1>VoxFlow</h1>
        <span>Voice → Text</span>
      </div>
    </div>
    <div class="settings-row">
      <div class="mode-switch">
        <button class="mode-btn active" id="holdMode" onclick="setMode('hold')">Hold to talk</button>
        <button class="mode-btn" id="toggleMode" onclick="setMode('toggle')">Click toggle</button>
      </div>
      <select class="lang-select" id="langSelect">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="it-IT">Italiano</option>
        <option value="pt-BR">Português</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="zh-CN">中文</option>
        <option value="hi-IN">हिन्दी</option>
        <option value="ar-SA">العربية</option>
        <option value="bn-IN">বাংলা</option>
      </select>
      <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>
  </header>

  <div class="output-area" id="outputArea">
    <div class="empty-state" id="emptyState">
      <div class="key-hint">
        Hold <span class="key-badge">Space</span> or press mic to speak
      </div>
      <p>Your voice will be transcribed in real-time. Release to stop. All processing happens locally in your browser.</p>
      <p style="color: var(--accent-bright); font-size: 12px; margin-top: 4px;">
        💡 Tip: Download this file and open it in Chrome for best results.
      </p>
    </div>
    <div class="transcript" id="transcript" style="display:none;"></div>
  </div>

  <div style="display: flex; justify-content: center; padding-bottom: 8px;">
    <button class="new-para-btn" onclick="newParagraph()">↵ New paragraph</button>
  </div>

  <div class="bottom-bar">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
      <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>

    <div style="position:relative;">
      <button class="mic-btn" id="micBtn">
        <div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <svg id="stopIcon" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>

    <div class="actions">
      <button class="action-btn" id="copyBtn" onclick="copyText()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy
      </button>
      <span class="word-count" id="wordCount"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const transcript = document.getElementById('transcript');
  const emptyState = document.getElementById('emptyState');
  const micBtn = document.getElementById('micBtn');
  const micIcon = document.getElementById('micIcon');
  const stopIcon = document.getElementById('stopIcon');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const visualizer = document.getElementById('visualizer');
  const langSelect = document.getElementById('langSelect');
  const copyBtn = document.getElementById('copyBtn');
  const wordCount = document.getElementById('wordCount');
  const outputArea = document.getElementById('outputArea');
  const toastEl = document.getElementById('toast');

  let recognition = null;
  let isRecording = false;
  let fullText = '';
  let interimText = '';
  let spaceHeld = false;
  let audioContext, analyser, micStream;
  let mode = 'hold'; // 'hold' or 'toggle'

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    emptyState.innerHTML = `
      <div class="key-hint" style="border-color: var(--recording);">⚠ Browser not supported</div>
      <p>Please use <strong>Chrome</strong> or <strong>Edge</strong> for speech recognition.</p>`;
  }

  function setMode(m) {
    mode = m;
    document.getElementById('holdMode').classList.toggle('active', m === 'hold');
    document.getElementById('toggleMode').classList.toggle('active', m === 'toggle');
    if (isRecording) stopRecording();
  }

  function initRecognition() {
    if (!SpeechRecognition) return null;
    const recog = new SpeechRecognition();
    recog.continuous = true;
    recog.interimResults = true;
    recog.lang = langSelect.value;
    recog.maxAlternatives = 1;

    recog.onresult = (event) => {
      let interim = '', final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t;
        else interim += t;
      }
      if (final) {
        fullText += (fullText && !fullText.endsWith('\n') ? ' ' : '') + final.trim();
      }
      interimText = interim;
      renderTranscript();
    };

    recog.onerror = (event) => {
      if (event.error === 'not-allowed') {
        toast('⚠ Mic blocked — check browser permissions (address bar)');
        stopRecording();
      } else if (event.error !== 'aborted' && event.error !== 'no-speech') {
        console.error('Speech error:', event.error);
        toast('Error: ' + event.error);
      }
    };

    recog.onend = () => {
      if (isRecording) {
        try { recog.start(); } catch(e) {}
      }
    };

    return recog;
  }

  async function startRecording() {
    if (isRecording) return;
    isRecording = true;
    interimText = '';

    recognition = initRecognition();
    if (!recognition) return;

    try {
      recognition.start();
    } catch (e) {
      toast('Error: ' + e.message);
      isRecording = false;
      return;
    }

    micBtn.classList.add('recording');
    micIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    statusDot.classList.add('recording');
    statusDot.classList.remove('ready');
    visualizer.classList.add('recording');
    statusText.textContent = 'Listening...';
    emptyState.style.display = 'none';
    transcript.style.display = 'block';
    startAudioVisualizer();
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;

    if (recognition) { recognition.stop(); recognition = null; }

    if (interimText.trim()) {
      fullText += (fullText ? ' ' : '') + interimText.trim();
      interimText = '';
    }

    micBtn.classList.remove('recording');
    micIcon.style.display = 'block';
    stopIcon.style.display = 'none';
    statusDot.classList.remove('recording');
    statusDot.classList.add('ready');
    visualizer.classList.remove('recording');
    statusText.textContent = 'Ready';
    stopAudioVisualizer();
    renderTranscript();
  }

  function renderTranscript() {
    let html = escapeHtml(fullText);
    if (interimText) {
      html += `<span class="interim">${escapeHtml(interimText)}</span>`;
    }
    transcript.innerHTML = html || '';

    if (!fullText && !interimText) {
      transcript.style.display = 'none';
      emptyState.style.display = 'flex';
    } else {
      transcript.style.display = 'block';
      emptyState.style.display = 'none';
    }

    const words = fullText.trim().split(/\s+/).filter(w => w.length > 0);
    wordCount.textContent = words.length > 0 ? `${words.length} word${words.length !== 1 ? 's' : ''}` : '';
    outputArea.scrollTop = outputArea.scrollHeight;
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function newParagraph() {
    if (fullText.trim()) {
      fullText += '\n\n';
      renderTranscript();
    }
  }

  function copyText() {
    if (!fullText.trim()) { toast('Nothing to copy'); return; }
    navigator.clipboard.writeText(fullText.trim()).then(() => {
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
      toast('Copied to clipboard');
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
      }, 2000);
    });
  }

  function clearAll() {
    fullText = ''; interimText = '';
    if (isRecording) stopRecording();
    renderTranscript();
    toast('Cleared');
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
  }

  async function startAudioVisualizer() {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioContext.createMediaStreamSource(micStream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);
      updateBars();
    } catch (e) { /* visualizer is non-critical */ }
  }

  function updateBars() {
    if (!isRecording || !analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const bars = visualizer.querySelectorAll('.bar');
    bars.forEach((bar, i) => {
      const val = data[i * 2] || 0;
      bar.style.height = Math.max(4, (val / 255) * 30) + 'px';
    });
    requestAnimationFrame(updateBars);
  }

  function stopAudioVisualizer() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioContext) { audioContext.close(); audioContext = null; }
    visualizer.querySelectorAll('.bar').forEach(bar => bar.style.height = '4px');
  }

  // ── Keyboard: Hold Space ──
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !spaceHeld && !isInputFocused(e)) {
      e.preventDefault();
      spaceHeld = true;
      if (mode === 'hold') startRecording();
      else { isRecording ? stopRecording() : startRecording(); }
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && spaceHeld) {
      e.preventDefault();
      spaceHeld = false;
      if (mode === 'hold') stopRecording();
    }
  });

  function isInputFocused(e) {
    const t = e.target.tagName;
    return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || e.target.isContentEditable;
  }

  // ── Mouse: click / hold mic ──
  if (true) {
    micBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (mode === 'hold') startRecording();
      else { isRecording ? stopRecording() : startRecording(); }
    });
    micBtn.addEventListener('mouseup', (e) => {
      e.preventDefault();
      if (mode === 'hold') stopRecording();
    });
    micBtn.addEventListener('mouseleave', () => {
      if (mode === 'hold' && isRecording && !spaceHeld) stopRecording();
    });

    // Touch
    micBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (mode === 'hold') startRecording();
      else { isRecording ? stopRecording() : startRecording(); }
    });
    micBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (mode === 'hold') stopRecording();
    });
  }

  // Language change
  langSelect.addEventListener('change', () => {
    if (isRecording) { stopRecording(); setTimeout(startRecording, 200); }
  });

  statusDot.classList.add('ready');
</script>
</body>
</html>
